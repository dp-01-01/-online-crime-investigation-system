{% extends "base.html" %}

{% block title %}
Add New Case - Crime Investigation System
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1>Add New Case</h1>

    <p class="text-muted">
        Enter the details of the new crime case.
    </p>

    <div class="card shadow mt-4">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Case Number
                    </label>

                    <input
                        type="text"
                        name="case_number"
                        class="form-control"
                        placeholder="Example: CASE001"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Crime Type
                    </label>

                    <input
                        type="text"
                        name="crime_type"
                        class="form-control"
                        placeholder="Example: Theft"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        placeholder="Example: Visakhapatnam"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Incident Date
                    </label>

                    <input
                        type="date"
                        name="incident_date"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter case description"
                    ></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Status
                    </label>

                    <select name="status" class="form-control">

                        <option value="Open">
                            Open
                        </option>

                        <option value="Under Investigation">
                            Under Investigation
                        </option>

                        <option value="Closed">
                            Closed
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Investigator
                    </label>

                    <input
                        type="text"
                        name="investigator"
                        class="form-control"
                        placeholder="Example: Officer Ravi"
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-dark"
                >
                    Add Case
                </button>

                <a
                    href="/cases"
                    class="btn btn-outline-dark"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
