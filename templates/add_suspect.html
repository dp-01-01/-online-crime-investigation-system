{% extends "base.html" %}

{% block title %}
Add New Suspect - Crime Investigation System
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1>Add New Suspect</h1>

    <p class="text-muted">
        Enter suspect details related to a crime case.
    </p>

    <div class="card shadow mt-4">

        <div class="card-body">

            <form method="POST">

                <!-- Case Number -->
                <div class="mb-3">
                    <label class="form-label">
                        Case Number
                    </label>

                    <input
                        type="text"
                        name="case_number"
                        class="form-control"
                        placeholder="Example: CASE001"
                        required
                    >
                </div>


                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">
                        Suspect Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Example: Sample Person"
                        required
                    >
                </div>


                <!-- Age -->
                <div class="mb-3">
                    <label class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        class="form-control"
                        placeholder="Example: 30"
                        min="0"
                        max="120"
                    >
                </div>


                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">
                        Gender
                    </label>

                    <select
                        name="gender"
                        class="form-control"
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>
                </div>


                <!-- Phone -->
                <div class="mb-3">
                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        placeholder="Example: 9000000000"
                    >
                </div>


                <!-- Address -->
                <div class="mb-3">
                    <label class="form-label">
                        Address
                    </label>

                    <input
                        type="text"
                        name="address"
                        class="form-control"
                        placeholder="Example: Sample Address"
                    >
                </div>


                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter additional information"
                    ></textarea>
                </div>


                <!-- Status -->
                <div class="mb-3">
                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-control"
                    >

                        <option value="Under Investigation">
                            Under Investigation
                        </option>

                        <option value="Wanted">
                            Wanted
                        </option>

                        <option value="Released">
                            Released
                        </option>

                        <option value="Cleared">
                            Cleared
                        </option>

                    </select>
                </div>


                <!-- Buttons -->
                <button
                    type="submit"
                    class="btn btn-dark"
                >
                    Add Suspect
                </button>

                <a
                    href="/suspects"
                    class="btn btn-outline-dark"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
