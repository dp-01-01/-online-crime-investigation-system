<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        {% block title %}
        Online Crime Investigation System
        {% endblock %}

    </title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <!-- =========================
         NAVIGATION BAR
    ========================== -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">


            <!-- Website Name -->

            <a
                class="navbar-brand"
                href="/"
            >
                Crime Investigation System
            </a>


            <!-- Navigation Links -->

            <div>


                <!-- Home -->

                <a
                    href="/"
                    class="btn btn-outline-light btn-sm"
                >
                    Home
                </a>


                {% if session.get("user_id") %}


                    <!-- Dashboard -->

                    <a
                        href="/dashboard"
                        class="btn btn-outline-light btn-sm"
                    >
                        Dashboard
                    </a>


                    <!-- Username -->

                    <span
                        class="text-white ms-2 me-2"
                    >
                        {{ session.get("username") }}
                    </span>


                    <!-- Role -->

                    <span
                        class="badge bg-secondary me-2"
                    >
                        {{ session.get("role") }}
                    </span>


                    <!-- Logout -->

                    <a
                        href="/logout"
                        class="btn btn-danger btn-sm"
                    >
                        Logout
                    </a>


                {% else %}


                    <!-- Login -->

                    <a
                        href="/login"
                        class="btn btn-light btn-sm"
                    >
                        Login
                    </a>


                    <!-- Register -->

                    <a
                        href="/register"
                        class="btn btn-outline-light btn-sm"
                    >
                        Register
                    </a>


                {% endif %}


            </div>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer
        class="bg-dark text-white text-center p-3 mt-5"
    >

        <p class="mb-0">

            Online Crime Investigation System © 2026

        </p>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


</body>

</html>
