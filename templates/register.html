{% extends "base.html" %}

{% block title %}
Register - Crime Investigation System
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        User Registration
                    </h2>


                    <form method="POST">


                        <!-- =========================
                             USERNAME
                        ========================== -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <!-- =========================
                             EMAIL
                        ========================== -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter email"
                                required
                            >

                        </div>


                        <!-- =========================
                             PASSWORD
                        ========================== -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required
                            >

                        </div>


                        <!-- =========================
                             ROLE
                        ========================== -->

                        <div class="mb-3">

                            <label class="form-label">
                                Role
                            </label>

                            <select
                                name="role"
                                class="form-control"
                                required
                            >

                                <option value="citizen">
                                    Citizen
                                </option>

                                <option value="investigator">
                                    Investigator
                                </option>

                                <option value="admin">
                                    Admin
                                </option>

                            </select>

                        </div>


                        <!-- =========================
                             REGISTER BUTTON
                        ========================== -->

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Register
                        </button>


                    </form>


                    <!-- =========================
                         LOGIN LINK
                    ========================== -->

                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </p>


                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
