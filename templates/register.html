{% extends "base.html" %}

{% block title %}
Register - Crime Investigation System
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <!-- Page Heading -->

                    <div class="text-center mb-4">

                        <span class="badge bg-dark mb-2">
                            Crime Investigation System
                        </span>

                        <h2 class="fw-bold">
                            Create Account
                        </h2>

                        <p class="text-muted mb-0">
                            Register as a citizen to use the system.
                        </p>

                    </div>


                    <form method="POST">


                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter email"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                minlength="6"
                                required
                            >

                            <div class="form-text">
                                Password must contain at least 6 characters.
                            </div>

                        </div>


                        <!-- ROLE -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Account Type
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="Citizen"
                                readonly
                            >

                            <!--
                                The role is fixed as citizen.
                                Admin and Investigator accounts
                                should not be created through
                                public registration.
                            -->

                            <input
                                type="hidden"
                                name="role"
                                value="citizen"
                            >

                        </div>


                        <!-- REGISTER BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Create Account
                        </button>


                    </form>


                    <!-- LOGIN LINK -->

                    <p class="text-center mt-4 mb-0">

                        Already have an account?

                        <a
                            href="/login"
                            class="fw-semibold text-dark"
                        >
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
